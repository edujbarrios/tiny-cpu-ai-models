name: Verify Pythia GGUF metadata
on:
  push:
    paths:
      - .github/workflows/verify-pythia-gguf.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Pythia Q4_K_M GGUF upstream LFS SHA-256
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          filename = "pythia-160m-Q4_K_M.gguf"
          candidates = [
              "tensorblock/pythia-160m-GGUF",
              "QuantFactory/pythia-160m-GGUF",
              "mradermacher/pythia-160m-GGUF",
          ]
          for repo in candidates:
              url = f"https://huggingface.co/api/models/{repo}/tree/main?recursive=true&limit=1000"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"tiny-cpu-ai-models/0.1"})
                  with urllib.request.urlopen(req,timeout=45) as response:
                      data = json.load(response)
                  print(f"UPSTREAM_REPO={repo}")
                  print("UPSTREAM_FILES="+repr([x.get("path") for x in data if x.get("path","").endswith(".gguf")]))
                  for item in data:
                      if item.get("path", "").lower().endswith("q4_k_m.gguf"):
                          sha = item.get("lfs",{}).get("oid")
                          print(f"VERIFIED_GGUF_FILENAME={item['path']}")
                          print(f"VERIFIED_GGUF_SHA256={sha}")
                          print(f"VERIFIED_GGUF_SIZE_BYTES={item.get('size')}")
                          print(f"VERIFIED_GGUF_URL=https://huggingface.co/{repo}/resolve/main/{item['path']}")
              except Exception as error:
                  print(f"UPSTREAM_ERROR={repo}: {error}")
          PY
