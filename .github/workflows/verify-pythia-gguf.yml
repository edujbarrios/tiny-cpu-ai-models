name: Verify Pythia CPU completion binary
on:
  push:
    paths:
      - .github/workflows/verify-pythia-gguf.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect pinned CPU runtime for completion interface
        run: |
          python - <<'PY'
          import run
          engine = run.ensure_runtime()
          print("ENGINE:", engine, flush=True)
          print("CPU_BINARIES:", sorted(x.name for x in engine.parent.rglob("llama-*") if x.is_file()), flush=True)
          PY
