name: Test CPU runner

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test standard-library runner
        run: python -m unittest discover -s tests -v
      - name: List models without network
        run: python run.py --list

  smoke-granite:
    name: Granite Q4 CPU integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and run Granite on CPU
        run: python run.py --max-tokens 24 "Responde con una sola palabra: hola"
      - name: Repeat without internet downloads
        run: python run.py --offline --max-tokens 24 "Responde con una sola palabra: adios"
