name: Verify LFM2-VL GGUF artifacts
on:
  push:
    paths:
      - .github/workflows/verify-lfm2-gguf.yml
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve model and projector checksum from publisher
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          repo="LiquidAI/LFM2-VL-450M-GGUF"
          url=f"https://huggingface.co/api/models/{repo}/tree/main?recursive=true&limit=1000"
          req=urllib.request.Request(url,headers={"User-Agent":"tiny-cpu-ai-models/0.1"})
          with urllib.request.urlopen(req,timeout=90) as response: data=json.load(response)
          for item in data:
              p=item.get("path","")
              if p.lower().endswith(".gguf"):
                  print("GGUF_ENTRY="+json.dumps({
                      "file":p,"bytes":item.get("size"),"sha256":item.get("lfs",{}).get("oid"),
                      "url":f"https://huggingface.co/{repo}/resolve/main/{p}"
                  },sort_keys=True),flush=True)
          PY
